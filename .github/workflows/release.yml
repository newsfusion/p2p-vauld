name: Release Chrome extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      archive: ${{ steps.release.outputs.archive }}

    steps:
      - name: Checkout repository history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve and verify release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "Release tag does not exist: $tag" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main" >&2
            exit 1
          fi
          git checkout --detach "refs/tags/$tag"
          version="${tag#v}"
          archive="p2p-extension-webstore-v${version}.zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify committed versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ "$package_version" != "$RELEASE_VERSION" || "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag, package.json, and manifest.json versions must match" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production extension
        run: pnpm build

      - name: Validate release manifests
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          pnpm validate:manifest manifest.json --root . --catalog src/shared/platforms/platform-catalog.json --expected-version "$RELEASE_VERSION"
          pnpm validate:manifest dist/manifest.json --root dist --catalog src/shared/platforms/platform-catalog.json --expected-version "$RELEASE_VERSION" --built

      - name: Create and inspect Web Store archive
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p releases
          archive_path="releases/$ARCHIVE_NAME"
          (
            cd dist
            zip -Xqr "../$archive_path" . -x ".DS_Store" "*/.DS_Store" "*.map" "*/.map"
          )
          unzip -Z1 "$archive_path" > archive-files.txt
          grep -qx "manifest.json" archive-files.txt
          if grep -E '(^|/)(\.DS_Store|\.env($|\.)|p2p-testdata/)|\.map$' archive-files.txt; then
            echo "Release archive contains forbidden files" >&2
            exit 1
          fi

      - name: Upload immutable release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webstore-${{ steps.release.outputs.version }}
          path: releases/${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Publish to Chrome Web Store
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: chrome-web-store
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.package.outputs.tag }}
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.package.outputs.tag }}
          fetch-depth: 0

      - name: Download validated archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webstore-${{ needs.package.outputs.version }}
          path: releases

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 900s
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit for review
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          ARCHIVE_PATH: releases/${{ needs.package.outputs.archive }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: node scripts/chrome-web-store.mjs "$ARCHIVE_PATH" "$RELEASE_VERSION"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          ARCHIVE_PATH: releases/${{ needs.package.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" --verify-tag --generate-notes --title "P2P Vauld $RELEASE_VERSION"
          fi
