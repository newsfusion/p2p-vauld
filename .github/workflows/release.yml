name: Release Chrome extension

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: MAJOR.MINOR.PATCH version to release from main
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      archive: ${{ steps.release.outputs.archive }}
      create_tag: ${{ steps.release.outputs.create_tag }}
      release_sha: ${{ steps.release.outputs.release_sha }}

    steps:
      - name: Checkout repository history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$EVENT_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must be run from the main branch" >&2
              exit 1
            fi
            version="$REQUESTED_VERSION"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release version must match MAJOR.MINOR.PATCH without a v prefix" >&2
              exit 1
            fi
            tag="v$version"
            release_sha="$EVENT_SHA"
            git checkout --detach "$release_sha"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              tag_commit="$(git rev-list -n 1 "$tag")"
              if [[ "$tag_commit" != "$release_sha" ]]; then
                echo "Existing release tag does not point to the selected main commit: $tag" >&2
                exit 1
              fi
              create_tag=false
            else
              create_tag=true
            fi
          else
            tag="$REQUESTED_TAG"
            if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release tag must match vMAJOR.MINOR.PATCH" >&2
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Release tag does not exist: $tag" >&2
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "$tag")"
            if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
              echo "Release tag must point to a commit reachable from origin/main" >&2
              exit 1
            fi
            release_sha="$tag_commit"
            git checkout --detach "$release_sha"
            version="${tag#v}"
            create_tag=false
          fi

          archive="p2p-extension-webstore-v${version}.zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "create_tag=$create_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify committed versions
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ "$package_version" != "$RELEASE_VERSION" || "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag, package.json, and manifest.json versions must match" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build production extension
        run: pnpm build

      - name: Validate release manifests
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          pnpm validate:manifest manifest.json --root . --catalog src/shared/platforms/platform-catalog.json --expected-version "$RELEASE_VERSION"
          pnpm validate:manifest dist/manifest.json --root dist --catalog src/shared/platforms/platform-catalog.json --expected-version "$RELEASE_VERSION" --built

      - name: Create and inspect Web Store archive
        env:
          ARCHIVE_NAME: ${{ steps.release.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p releases
          archive_path="releases/$ARCHIVE_NAME"
          (
            cd dist
            zip -Xqr "../$archive_path" . -x ".DS_Store" "*/.DS_Store" "*.map" "*/.map"
          )
          unzip -Z1 "$archive_path" > archive-files.txt
          grep -qx "manifest.json" archive-files.txt
          if grep -E '(^|/)(\.DS_Store|\.env($|\.)|p2p-testdata/)|\.map$' archive-files.txt; then
            echo "Release archive contains forbidden files" >&2
            exit 1
          fi

      - name: Upload immutable release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webstore-${{ steps.release.outputs.version }}
          path: releases/${{ steps.release.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webstore-${{ needs.package.outputs.version }}
          path: releases

      - name: Create release tag for manual runs
        if: ${{ needs.package.outputs.create_tag == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_SHA: ${{ needs.package.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$RELEASE_SHA"

      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          ARCHIVE_PATH: releases/${{ needs.package.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists; refusing to replace its archive: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$ARCHIVE_PATH" --verify-tag --generate-notes --title "P2P Vauld $RELEASE_VERSION"
